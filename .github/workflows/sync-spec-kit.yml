name: Sync Spec Kit Skills

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force regeneration even when the upstream version has not changed"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-spec-kit.yml"

permissions:
  contents: write

concurrency:
  group: sync-spec-kit-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect latest Spec Kit release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_SYNC: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force) || false }}
        run: |
          set -euo pipefail

          tag="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/github/spec-kit/releases/latest \
            | jq -r '.tag_name // empty')"

          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "Unable to resolve github/spec-kit latest release tag" >&2
            exit 1
          fi

          current="uninitialized"
          if [[ -f UPSTREAM_VERSION ]]; then
            current="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          fi

          release_http="$(curl --silent --show-error \
            -o "${RUNNER_TEMP}/release.json" \
            -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")"

          case "${release_http}" in
            200) release_exists=true ;;
            404) release_exists=false ;;
            *)
              cat "${RUNNER_TEMP}/release.json" >&2 || true
              echo "Unable to check release ${tag}; HTTP ${release_http}" >&2
              exit 1
              ;;
          esac

          needs_sync=false
          if [[ "${tag}" != "${current}" || "${FORCE_SYNC}" == "true" ]]; then
            needs_sync=true
          fi

          needs_release=false
          if [[ "${release_exists}" != "true" || "${needs_sync}" == "true" ]]; then
            needs_release=true
          fi

          echo "Latest upstream release: ${tag}"
          echo "Current mirrored release: ${current}"
          echo "Release exists: ${release_exists}"
          echo "Needs sync: ${needs_sync}"
          echo "Needs release publication: ${needs_release}"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_exists=${release_exists}" >> "${GITHUB_OUTPUT}"
          echo "needs_sync=${needs_sync}" >> "${GITHUB_OUTPUT}"
          echo "needs_release=${needs_release}" >> "${GITHUB_OUTPUT}"

      - name: Install uv
        if: steps.upstream.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Generate official Codex skills and bundled runtime
        if: steps.upstream.outputs.needs_sync == 'true'
        shell: bash
        env:
          SPEC_KIT_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          generated="${RUNNER_TEMP}/spec-kit-generated"
          rm -rf "${generated}"

          uvx --from "git+https://github.com/github/spec-kit.git@${SPEC_KIT_TAG}" \
            specify init "${generated}" \
            --integration codex \
            --non-interactive \
            --ignore-agent-tools

          source_skills="${generated}/.agents/skills"
          source_runtime="${generated}/.specify"

          if [[ ! -d "${source_skills}" ]]; then
            echo "Spec Kit did not generate ${source_skills}" >&2
            exit 1
          fi
          if [[ ! -d "${source_runtime}" ]]; then
            echo "Spec Kit did not generate ${source_runtime}" >&2
            exit 1
          fi

          rm -rf skills
          mkdir -p skills
          cp -a "${source_skills}/." skills/

          for skill_dir in skills/speckit-*; do
            [[ -d "${skill_dir}" ]] || continue

            mkdir -p "${skill_dir}/runtime/.specify" "${skill_dir}/scripts"
            cp -a "${source_runtime}/." "${skill_dir}/runtime/.specify/"

            cat > "${skill_dir}/scripts/bootstrap-spec-kit.sh" <<'EOF_BOOTSTRAP'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(CDPATH="" cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          SKILL_DIR="$(CDPATH="" cd "${SCRIPT_DIR}/.." && pwd)"
          RUNTIME_DIR="${SKILL_DIR}/runtime/.specify"

          if [[ ! -d "${RUNTIME_DIR}" ]]; then
            echo "ERROR: bundled Spec Kit runtime not found: ${RUNTIME_DIR}" >&2
            exit 1
          fi

          if [[ $# -gt 1 ]]; then
            echo "Usage: $0 [project-root]" >&2
            exit 2
          fi

          if [[ $# -eq 1 ]]; then
            PROJECT_ROOT="$(CDPATH="" cd "$1" && pwd)"
          elif git_root="$(git rev-parse --show-toplevel 2>/dev/null)"; then
            PROJECT_ROOT="${git_root}"
          else
            PROJECT_ROOT="$(pwd)"
          fi

          TARGET_DIR="${PROJECT_ROOT}/.specify"
          mkdir -p "${TARGET_DIR}"

          added=0

          while IFS= read -r -d '' src_dir; do
            rel="${src_dir#${RUNTIME_DIR}/}"
            [[ "${src_dir}" == "${RUNTIME_DIR}" ]] && rel=""
            mkdir -p "${TARGET_DIR}${rel:+/${rel}}"
          done < <(find "${RUNTIME_DIR}" -type d -print0)

          while IFS= read -r -d '' src_file; do
            rel="${src_file#${RUNTIME_DIR}/}"
            dst_file="${TARGET_DIR}/${rel}"
            if [[ ! -e "${dst_file}" ]]; then
              mkdir -p "$(dirname "${dst_file}")"
              cp -p "${src_file}" "${dst_file}"
              echo "Added .specify/${rel}"
              added=$((added + 1))
            fi
          done < <(find "${RUNTIME_DIR}" -type f -print0)

          if [[ ! -e "${TARGET_DIR}/extensions.yml" ]]; then
            cat > "${TARGET_DIR}/extensions.yml" <<'EOF_EXTENSIONS'
          # No Spec Kit extensions are configured yet.
          hooks: {}
          EOF_EXTENSIONS
            echo "Added .specify/extensions.yml"
            added=$((added + 1))
          fi

          if [[ -d "${TARGET_DIR}/scripts/bash" ]]; then
            find "${TARGET_DIR}/scripts/bash" -type f -name '*.sh' -exec chmod +x {} +
          fi

          echo "Spec Kit runtime ready at ${TARGET_DIR} (${added} missing file(s) added; existing files preserved)."
          EOF_BOOTSTRAP

            chmod +x "${skill_dir}/scripts/bootstrap-spec-kit.sh"
          done

          python3 - <<'PY'
          from pathlib import Path

          bootstrap = '''## Runtime Bootstrap

          **Before any other pre-execution checks**, ensure the current project has the Spec Kit runtime required by this workflow.

          1. Locate this Skill directory (the directory containing this `SKILL.md`).
          2. Run its bundled bootstrap script against the current project root:
             `bash <skill-directory>/scripts/bootstrap-spec-kit.sh <project-root>`
          3. The bootstrap copies only missing files from the bundled, version-matched `runtime/.specify/` scaffold. It **must not overwrite** existing project files such as the constitution, templates, feature state, or extension configuration.
          4. If `.specify/extensions.yml` is missing, the bootstrap creates a valid empty configuration (`hooks: {}`), so subsequent hook checks operate on a complete scaffold rather than reporting a missing file.
          5. If bootstrap fails, stop and report the exact error before continuing.

          This Skill is distributed as a self-contained Spec Kit Skill; users do not need to run `specify init` separately just to satisfy runtime file dependencies.

          '''

          for path in sorted(Path('skills').glob('speckit-*/SKILL.md')):
              text = path.read_text(encoding='utf-8')
              if '## Runtime Bootstrap' in text:
                  continue
              if not text.startswith('---\n'):
                  raise SystemExit(f'Unexpected frontmatter format: {path}')
              end = text.find('\n---\n', 4)
              if end == -1:
                  raise SystemExit(f'Unable to locate frontmatter end: {path}')
              insert_at = end + len('\n---\n')
              text = text[:insert_at] + '\n\n' + bootstrap + text[insert_at:].lstrip('\n')
              text = text.replace(
                  'compatibility: "Requires spec-kit project structure with .specify/ directory"',
                  'compatibility: "Self-contained Spec Kit Skill with bundled runtime bootstrap; existing project .specify files are preserved"',
              )
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate generated skills and runtime bootstrap
        if: steps.upstream.outputs.needs_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "skills/speckit-constitution/SKILL.md"
            "skills/speckit-specify/SKILL.md"
            "skills/speckit-clarify/SKILL.md"
            "skills/speckit-plan/SKILL.md"
            "skills/speckit-tasks/SKILL.md"
            "skills/speckit-checklist/SKILL.md"
            "skills/speckit-analyze/SKILL.md"
            "skills/speckit-implement/SKILL.md"
            "skills/speckit-converge/SKILL.md"
            "skills/speckit-taskstoissues/SKILL.md"
          )

          for path in "${required[@]}"; do
            if [[ ! -s "${path}" ]]; then
              echo "Missing or empty required skill: ${path}" >&2
              exit 1
            fi
          done

          skill_count="$(find skills -type f -name SKILL.md | wc -l | tr -d '[:space:]')"
          if [[ "${skill_count}" -lt 1 ]]; then
            echo "No SKILL.md files were generated" >&2
            exit 1
          fi

          for skill_dir in skills/speckit-*; do
            [[ -d "${skill_dir}" ]] || continue
            test -x "${skill_dir}/scripts/bootstrap-spec-kit.sh"
            test -s "${skill_dir}/runtime/.specify/scripts/bash/check-prerequisites.sh"
            test -s "${skill_dir}/runtime/.specify/scripts/bash/common.sh"
            test -d "${skill_dir}/runtime/.specify/templates"
            grep -q '^## Runtime Bootstrap$' "${skill_dir}/SKILL.md"
          done

          # Functional bootstrap regression test: start with a partial project,
          # preserve an existing file, fill the missing runtime, then execute the
          # exact helper that speckit-clarify requires.
          test_project="${RUNNER_TEMP}/runtime-bootstrap-test"
          rm -rf "${test_project}"
          mkdir -p "${test_project}/.specify/memory" "${test_project}/specs/001-test"
          printf 'CUSTOM-CONSTITUTION\n' > "${test_project}/.specify/memory/constitution.md"
          printf '# Test Spec\n' > "${test_project}/specs/001-test/spec.md"
          printf '{"feature_directory":"specs/001-test"}\n' > "${test_project}/.specify/feature.json"

          bash skills/speckit-clarify/scripts/bootstrap-spec-kit.sh "${test_project}"

          grep -q '^CUSTOM-CONSTITUTION$' "${test_project}/.specify/memory/constitution.md"
          grep -q '^hooks: {}$' "${test_project}/.specify/extensions.yml"
          test -x "${test_project}/.specify/scripts/bash/check-prerequisites.sh"

          paths_json="$(cd "${test_project}" && .specify/scripts/bash/check-prerequisites.sh --json --paths-only)"
          printf '%s\n' "${paths_json}" | jq -e '.FEATURE_SPEC | endswith("/specs/001-test/spec.md")' >/dev/null

          echo "Validated ${skill_count} generated skills with self-contained Spec Kit runtime bootstrap"

      - name: Update upstream version marker
        if: steps.upstream.outputs.needs_sync == 'true'
        shell: bash
        env:
          SPEC_KIT_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SPEC_KIT_TAG}" > UPSTREAM_VERSION

      - name: Commit and push changes
        if: steps.upstream.outputs.needs_sync == 'true'
        shell: bash
        env:
          SPEC_KIT_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- skills UPSTREAM_VERSION; then
            git add skills UPSTREAM_VERSION
            git commit -m "chore: sync spec-kit ${SPEC_KIT_TAG} with bundled runtime"
            git push origin HEAD:main
          else
            echo "Generated output is unchanged; nothing to commit."
          fi

      - name: Build release assets
        if: steps.upstream.outputs.needs_release == 'true'
        shell: bash
        env:
          SPEC_KIT_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          package_name="spec-kit-skills-${SPEC_KIT_TAG}"
          package_dir="${RUNNER_TEMP}/${package_name}"
          rm -rf "${package_dir}"
          mkdir -p "${package_dir}"

          cp -a skills "${package_dir}/skills"
          cp README.md README.zh-CN.md UPSTREAM_VERSION "${package_dir}/"

          (
            cd "${RUNNER_TEMP}"
            zip -qr "${GITHUB_WORKSPACE}/${package_name}.zip" "${package_name}"
            tar -czf "${GITHUB_WORKSPACE}/${package_name}.tar.gz" "${package_name}"
          )

          sha256sum \
            "${package_name}.zip" \
            "${package_name}.tar.gz" \
            > SHA256SUMS

      - name: Publish GitHub Release and retag current distribution
        if: steps.upstream.outputs.needs_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_KIT_TAG: ${{ steps.upstream.outputs.tag }}
          RELEASE_EXISTS: ${{ steps.upstream.outputs.release_exists }}
        run: |
          set -euo pipefail

          package_name="spec-kit-skills-${SPEC_KIT_TAG}"
          release_sha="$(git rev-parse HEAD)"
          notes="$(cat <<EOF_NOTES
          Ready-to-use Codex Skills generated from upstream Spec Kit ${SPEC_KIT_TAG}.

          This distribution bundles a version-matched Spec Kit runtime inside each Skill. When a project has a missing or partial `.specify/` scaffold, the Skill bootstrap fills only the missing runtime files and preserves existing project configuration and artifacts.

          Upstream release: https://github.com/github/spec-kit/releases/tag/${SPEC_KIT_TAG}

          Assets:
          - ${package_name}.zip
          - ${package_name}.tar.gz
          - SHA256SUMS
          EOF_NOTES
          )"

          if [[ "${RELEASE_EXISTS}" == "true" ]]; then
            git tag -f "${SPEC_KIT_TAG}" "${release_sha}"
            git push --force origin "refs/tags/${SPEC_KIT_TAG}"

            gh release edit "${SPEC_KIT_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Spec Kit Skills ${SPEC_KIT_TAG}" \
              --notes "${notes}"

            gh release upload "${SPEC_KIT_TAG}" \
              "${package_name}.zip" \
              "${package_name}.tar.gz" \
              SHA256SUMS \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${SPEC_KIT_TAG}" \
              "${package_name}.zip" \
              "${package_name}.tar.gz" \
              SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${release_sha}" \
              --title "Spec Kit Skills ${SPEC_KIT_TAG}" \
              --notes "${notes}"
          fi
